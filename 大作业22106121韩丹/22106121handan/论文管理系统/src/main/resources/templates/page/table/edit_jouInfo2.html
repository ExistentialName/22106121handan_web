                       placeholder="请输入论文标题" value="" class="layui-input">
            </div>
        </div>

                       placeholder="请输入论文下载路径" value="" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">返回</button>
            </div>
        </div>
    </div>
</div>
